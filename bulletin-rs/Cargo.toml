[workspace]
members = ["crates/bulletin-core", "crates/bulletin-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Bulletin contributors"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.41", features = ["bundled", "chrono", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
unicode-normalization = "0.1"
calamine = "0.37"
rust_xlsxwriter = "0.101"
rfd = "0.17"
slint = "1.18"
slint-build = "1.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
