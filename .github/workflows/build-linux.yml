name: Build Linux Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bulletin-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build bulletin-app (release)
        working-directory: ./bulletin-rs
        run: |
          cargo build --release -p bulletin-app

      - name: Verify executable
        working-directory: ./bulletin-rs
        run: |
          ls -la target/release/bulletin-app
          ./target/release/bulletin-app --version || true

      - name: Create release archive
        working-directory: ./bulletin-rs
        run: |
          mkdir -p dist
          cp target/release/bulletin-app dist/bulletin-linux-x86_64
          chmod +x dist/bulletin-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-linux-x86_64
          path: bulletin-rs/dist/bulletin-linux-x86_64
          retention-days: 30

      - name: Create GitHub Release (Linux)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}-linux
          name: "Bulletin v${{ github.run_number }} - Linux x86_64"
          body: |
            Build automatique Linux depuis le commit ${{ github.sha }}
            
            **Fichier :** `bulletin-linux-x86_64` (standalone, sans dépendances)
            
            **Utilisation :**
            1. Téléchargez `bulletin-linux-x86_64`
            2. `chmod +x bulletin-linux-x86_64`
            3. Lancez `./bulletin-linux-x86_64`
          draft: false
          prerelease: false
          files: bulletin-rs/dist/bulletin-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}